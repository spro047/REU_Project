  <rect x="390" y="472" width="290" height="44" rx="4" fill="#fff" stroke="#e0dcd3" stroke-width="1"/>

  <rect x="720" y="472" width="290" height="44" rx="4" fill="#fff" stroke="#e0dcd3" stroke-width="1"/>
  <text x="865" y="492" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Frame Inventory</text>
  <text x="865" y="507" text-anchor="middle" font-size="10" fill="#666">~700–1,500 frames · Annotator-ready</text>

  <text x="60" y="548" font-size="10" fill="#888">Frames center-cropped to 2160², resized to 384×384, normalized (ImageNet stats)</text>

  <path d="M550,575 L550,605" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- GATE 2 -->
  <polygon points="550,610 610,650 550,690 490,650" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="615" y="646" font-size="11" font-weight="700" fill="#1a1a1a">YES →</text>
  <path d="M490,650 L25,650 L25,170 L60,170" stroke="#999" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arr-gray)" fill="none"/>
  <text x="27" y="420" font-size="10" fill="#888" transform="rotate(-90,27,420)">RE-RUN EXTRACTION</text>

  <!-- ================================================================ -->
  <!-- PHASE 2 — Annotation -->
  <!-- ================================================================ -->
  <path d="M610,650 L820,650 L820,715 L700,715" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <rect x="40" y="720" width="1020" height="150" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="60" y="745" font-size="14" font-weight="700" fill="#1a1a1a">Phase 2 — Expert Annotation Protocol</text>

  <text x="535" y="787" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Dual-Blinded Expert Review</text>

  <rect x="720" y="767" width="290" height="44" rx="4" fill="#fff" stroke="#e0dcd3" stroke-width="1"/>
  <text x="865" y="787" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Reliability Checks</text>
  <text x="865" y="802" text-anchor="middle" font-size="10" fill="#666">10% double-annotated · 5% re-annotated (2wk)</text>

  <text x="60" y="843" font-size="10" fill="#888">Target: Cohen's κ ≥ 0.75 · Pearson r ≥ 0.85</text>
  <text x="60" y="857" font-size="10" fill="#888">Guidelines: Reference guide · Score exemplars · Calibration sessions</text>

  <path d="M550,870 L550,900" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="615" y="941" font-size="11" font-weight="700" fill="#1a1a1a">YES →</text>
  <path d="M490,945 L25,945 L25,790 L60,790" stroke="#999" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arr-gray)" fill="none"/>
  <text x="27" y="870" font-size="10" fill="#888" transform="rotate(-90,27,870)">RETRAIN ANNOTATORS</text>

  <!-- ================================================================ -->
  <!-- PHASE 3 — EDA & Preprocessing -->
  <!-- ================================================================ -->
  <path d="M610,945 L820,945 L820,1010 L700,1010" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)" fill="none"/>

  <rect x="390" y="1062" width="290" height="44" rx="4" fill="#fff" stroke="#e0dcd3" stroke-width="1"/>

  <text x="520" y="1286" text-anchor="middle" font-size="10" fill="#666">AdamW · Cosine LR · 100 epochs</text>

  <path d="M610,1274 L630,1274" stroke="#999" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <rect x="635" y="1250" width="180" height="48" rx="4" fill="#fff" stroke="#e0dcd3" stroke-width="1"/>
  <text x="725" y="1270" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Loss Function</text>

  <text x="60" y="1350" font-size="10" fill="#666">

  </text>

  <text x="60" y="1375" font-size="11" font-weight="600" fill="#1a1a1a">Baselines</text>
  <text x="60" y="1390" font-size="10" fill="#666">

  </text>

  </text>

  <path d="M550,1420 L550,1450" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ================================================================ -->

  <text x="60" y="1480" font-size="14" font-weight="700" fill="#1a1a1a">Phase 5 — Uncertainty &amp; Explainability</text>
  <line x1="60" y1="1488" x2="1040" y2="1488" stroke="#e0dcd3" stroke-width="1"/>

  <rect x="60" y="1502" width="440" height="44" rx="4" fill="#fff" stroke="#e0dcd3" stroke-width="1"/>
  <text x="280" y="1522" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">MC Dropout × 50</text>
  <text x="280" y="1538" text-anchor="middle" font-size="10" fill="#666">Mean + 95% CI per metric · CI &gt; 3.0 → flag for review</text>

  <rect x="540" y="1502" width="470" height="44" rx="4" fill="#fff" stroke="#e0dcd3" stroke-width="1"/>
  <text x="775" y="1522" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Grad-CAM Explainability</text>
  <text x="775" y="1538" text-anchor="middle" font-size="10" fill="#666">6 heatmaps per image (one per metric)</text>

  <text x="60" y="1568" font-size="10" fill="#888">Rationale: No prior suture AI provides uncertainty estimates (Boal). All prior systems are black-box (Pan).</text>

  <rect x="235" y="1670" width="165" height="50" rx="4" fill="#fff" stroke="#e0dcd3" stroke-width="1"/>

  <rect x="605" y="1670" width="165" height="50" rx="4" fill="#fff" stroke="#e0dcd3" stroke-width="1"/>

  <rect x="790" y="1670" width="200" height="50" rx="4" fill="#fff" stroke="#e0dcd3" stroke-width="1"/>
  <text x="890" y="1690" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">⑤ Consequences</text>
  <text x="890" y="1706" text-anchor="middle" font-size="10" fill="#666">Error analysis, failure modes</text>

  <text x="60" y="1755" font-size="10" fill="#888">Criteria: MAE&lt;1.0 · R²&gt;0.50 · Acc@2&gt;85% · 95% CI coverage 90–95%</text>

  <path d="M550,1790 L550,1820" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <polygon points="550,1825 610,1865 550,1905 490,1865" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="550" y="1861" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">All 5</text>
  <text x="550" y="1874" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a1a">Passed?</text>
  <text x="615" y="1861" font-size="11" font-weight="700" fill="#1a1a1a">YES →</text>
  <path d="M490,1865 L20,1865 L20,1290 L60,1290" stroke="#999" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arr-gray)" fill="none"/>

  <!-- ================================================================ -->
